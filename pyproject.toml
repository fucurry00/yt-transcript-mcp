[project]
name = "youtube-transcript-mcp"
version = "0.1.0"
description = "MCP server for extracting YouTube video transcripts"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "youtube-transcript-api>=1.0.0",
    "pydantic>=2.0.0",
    # Required, not optional: metadata is fetched on every transcript call.
    # yt-dlp breaks as YouTube changes, so refresh it with
    # `uv lock --upgrade-package yt-dlp && uv sync` rather than letting uv.lock
    # pin an old version indefinitely.
    # Frames need [default] for yt-dlp-ejs, the script that solves YouTube's "n"
    # challenge, and [deno] for the JS runtime that runs it. Without both, the
    # web_embedded and tv_simply clients list no video formats. yt-dlp pins ejs
    # exactly, so it comes via [default] rather than by name; [default] also
    # brings brotli, certifi, mutagen, pycryptodomex, requests, urllib3 and
    # websockets. 2026.1.29 is the first release with the [deno] extra.
    "yt-dlp[default,deno]>=2026.1.29",
    # Ships a static ffmpeg binary, so frame extraction needs no brew/nix install.
    "imageio-ffmpeg>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "ruff>=0.15.6",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle + pyflakes + isort
