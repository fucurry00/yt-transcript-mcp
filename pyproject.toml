[project]
name = "youtube-transcript-mcp"
version = "0.1.0"
description = "MCP server for extracting YouTube video transcripts"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0",
    "youtube-transcript-api>=1.0.0",
    "pydantic>=2.0.0",
    # Required, not optional: metadata is fetched on every transcript call.
    # yt-dlp breaks as YouTube changes, so refresh it with
    # `uv lock --upgrade-package yt-dlp && uv sync` rather than letting uv.lock
    # pin an old version indefinitely.
    "yt-dlp>=2024.0.0",
    # Ships a static ffmpeg binary, so frame extraction needs no brew/nix install.
    "imageio-ffmpeg>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "ruff>=0.15.6",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle + pyflakes + isort
